backend:
  image:
    repository: ghcr.io/project-construct-x/usecase-management-backend
    tag: latest
  storage:
    size: 30Gi

frontend:
  image:
    repository: ghcr.io/project-construct-x/usecase-management-frontend
    tag: latest

ingress:
  host: usecase-management.example.com
  className: nginx
  clusterIssuer: letsencrypt-prod

db:
  env:
    user: "user"
    password: "password"
    db: "appdb"
  storage:
    size: 30Gi
