apiVersion: v1
kind: Service
metadata:
  name: usecase-management-db
spec:
  selector:
    app: usecase-management-db
  ports:
    - port: 5432
      name: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: usecase-management-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.db.storage.className }}
  resources:
    requests:
      storage: {{ .Values.db.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase-management-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: usecase-management-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: usecase-management-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: usecase-management-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: usecase-management-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: usecase-management-db-pvc
